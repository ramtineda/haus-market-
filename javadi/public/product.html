<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات محصول – JAVADI</title>
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<div class="preloader" id="preloader">
  <div class="preloader-logo">JAVADI</div>
  <div class="preloader-bar"></div>
</div>

<div id="headerSlot"></div>

<main id="productMain">
  <div class="container" style="padding:120px 20px 60px">
    <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
  </div>
</main>

<div id="footerSlot"></div>

<style>
  .product-detail { padding: 24px 0 60px; }

  .product-detail-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .product-detail-grid { grid-template-columns: 1fr; gap: 32px; }
  }

  /* ==================== Gallery ==================== */
  .gallery { position: sticky; top: 100px; }

  @media (max-width: 900px) {
    .gallery { position: static; }
  }

  .gallery-main {
    aspect-ratio: 1;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    position: relative;
    cursor: zoom-in;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s var(--ease);
  }

  .gallery-main.zoomed img { transform: scale(1.6); cursor: zoom-out; }

  .gallery-main .zoom-hint {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 12px;
    border-radius: 50px;
    font-size: 0.75rem;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }

  .gallery-thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .gallery-thumb {
    aspect-ratio: 1;
    background: var(--bg-3);
    border: 2px solid transparent;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all var(--t-fast) var(--ease);
  }

  .gallery-thumb:hover { border-color: var(--border-2); }
  .gallery-thumb.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* ==================== Info ==================== */
  .product-detail-brand {
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 3px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .product-detail-title {
    font-size: clamp(1.4rem, 2.8vw, 2rem);
    font-weight: 400;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.4;
    letter-spacing: -0.3px;
  }

  .product-detail-price {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 18px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .price-current {
    font-size: 1.9rem;
    font-weight: 700;
    background: var(--gradient-warm);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .price-old {
    font-size: 1.05rem;
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .price-discount {
    background: var(--gradient-warm);
    color: #fff;
    font-size: 0.8rem;
    padding: 4px 12px;
    border-radius: 50px;
    font-weight: 700;
  }

  .product-stock {
    padding: 10px 16px;
    border-radius: 50px;
    font-size: 0.88rem;
    margin-bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }

  .product-stock.in {
    background: rgba(34, 197, 94, 0.1);
    color: #16a34a;
    border: 1px solid rgba(34, 197, 94, 0.2);
  }

  .product-stock.out {
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  [data-theme="dark"] .product-stock.in { color: #4ade80; }
  [data-theme="dark"] .product-stock.out { color: #f87171; }

  .product-detail-desc {
    color: var(--text-mid);
    line-height: 1.9;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  /* Quantity + Actions */
  .product-actions-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .quantity-selector {
    display: inline-flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-card);
  }

  .quantity-selector button {
    width: 44px;
    height: 48px;
    color: var(--text);
    font-size: 1.2rem;
    transition: all var(--t-fast) var(--ease);
  }

  .quantity-selector button:hover {
    background: var(--accent-glow);
    color: var(--accent);
  }

  .quantity-selector input {
    width: 56px;
    height: 48px;
    background: transparent;
    border: none;
    color: var(--text);
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    outline: none;
    font-family: inherit;
  }

  .product-actions-row .btn {
    height: 48px;
    min-width: 160px;
    flex: 1;
  }

  .wishlist-btn {
    width: 48px;
    height: 48px;
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    color: var(--text-mid);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    transition: all var(--t-fast) var(--ease);
    cursor: pointer;
  }

  .wishlist-btn:hover { border-color: var(--pink); color: var(--pink); }
  .wishlist-btn.active { background: var(--pink); color: #fff; border-color: var(--pink); }

  /* Meta Info */
  .product-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    padding: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-top: 24px;
  }

  .product-meta-item .label {
    color: var(--text-dim);
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .product-meta-item .value {
    color: var(--text);
    font-size: 0.92rem;
    font-weight: 600;
  }

  /* ==================== Tabs ==================== */
  .product-tabs { margin-top: 60px; }

  .tabs-nav {
    display: flex;
    gap: 32px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    padding: 0 4px;
  }

  .tab-btn {
    padding: 16px 0;
    color: var(--text-dim);
    font-size: 0.95rem;
    border-bottom: 2px solid transparent;
    transition: all var(--t-fast) var(--ease);
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: inherit;
  }

  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content {
    padding: 32px 0;
    color: var(--text-mid);
    line-height: 1.9;
    font-size: 0.95rem;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeInUp 0.4s var(--ease); }

  /* Specs Table */
  .specs-table {
    width: 100%;
    border-collapse: collapse;
    max-width: 700px;
  }

  .specs-table tr { border-bottom: 1px solid var(--border); }
  .specs-table td { padding: 14px 0; font-size: 0.92rem; }
  .specs-table td:first-child { color: var(--text-dim); width: 40%; }
  .specs-table td:last-child { color: var(--text); font-weight: 600; }

  /* Related */
  .related-title {
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 28px;
  }
</style>

<script src="/js/app.js"></script>
<script src="/js/search.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
