<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید – JAVADI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<div class="preloader" id="preloader">
  <div class="preloader-logo">JAVADI</div>
  <div class="preloader-bar"></div>
</div>

<div id="headerSlot"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb">
        <a href="/">صفحه اصلی</a>
        <span class="breadcrumb-sep">/</span>
        <span class="current">سبد خرید</span>
      </div>
      <h1>🛍 سبد خرید</h1>
      <p>محصولات انتخابی خود را بررسی و خریداری کنید</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div id="cartContent">
        <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
      </div>
    </div>
  </section>
</main>

<div id="footerSlot"></div>

<style>
  .cart-layout {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 32px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .cart-layout { grid-template-columns: 1fr; }
  }

  /* ==================== Cart Items ==================== */
  .cart-items {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cart-item {
    display: grid;
    grid-template-columns: 100px 1fr auto auto auto;
    gap: 18px;
    align-items: center;
    padding: 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    transition: all var(--t-fast) var(--ease);
    position: relative;
    overflow: hidden;
  }

  .cart-item::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 3px;
    background: var(--gradient-gold);
    transform: scaleY(0);
    transition: transform var(--t-fast) var(--ease);
  }

  .cart-item:hover {
    border-color: var(--accent);
    transform: translateX(-4px);
  }

  .cart-item:hover::before { transform: scaleY(1); }

  .cart-item-img {
    width: 100px;
    height: 100px;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-3);
    flex-shrink: 0;
  }

  .cart-item-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s var(--ease);
  }

  .cart-item:hover .cart-item-img img { transform: scale(1.08); }

  .cart-item-info h3 {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
    transition: color var(--t-fast) var(--ease);
  }

  .cart-item-info h3:hover { color: var(--accent); }

  .cart-item-info .unit-price {
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .cart-item-info .unit-price strong {
    color: var(--text-mid);
    font-weight: 600;
  }

  .cart-item-qty {
    display: inline-flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    overflow: hidden;
    background: var(--bg-3);
  }

  .cart-item-qty button {
    width: 36px;
    height: 40px;
    color: var(--text);
    font-size: 1rem;
    transition: all var(--t-fast) var(--ease);
  }

  .cart-item-qty button:hover {
    background: var(--accent-glow);
    color: var(--accent);
  }

  .cart-item-qty input {
    width: 46px;
    height: 40px;
    background: transparent;
    border: none;
    color: var(--text);
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    outline: none;
    font-family: inherit;
  }

  .cart-item-subtotal {
    text-align: left;
    min-width: 110px;
  }

  .cart-item-subtotal .label {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .cart-item-subtotal .value {
    color: var(--accent);
    font-size: 1.05rem;
    font-weight: 700;
  }

  .cart-item-remove {
    width: 38px;
    height: 38px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--t-fast) var(--ease);
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }

  .cart-item-remove:hover {
    border-color: var(--danger);
    color: #fff;
    background: var(--danger);
    transform: rotate(90deg) scale(1.1);
  }

  @media (max-width: 768px) {
    .cart-item {
      grid-template-columns: 80px 1fr auto;
      gap: 12px;
      padding: 14px;
    }
    .cart-item-img { width: 80px; height: 80px; }
    .cart-item-qty { grid-column: 2 / 3; grid-row: 2; justify-self: start; }
    .cart-item-subtotal {
      grid-column: 2 / 3;
      grid-row: 3;
      text-align: right;
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      min-width: 0;
    }
    .cart-item-subtotal .label { margin: 0; }
    .cart-item-remove { grid-column: 3; grid-row: 1; }
  }

  /* ==================== Cart Sidebar ==================== */
  .cart-sidebar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 26px;
    position: sticky;
    top: 100px;
    box-shadow: var(--shadow-sm);
  }

  .cart-sidebar h3 {
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cart-summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    color: var(--text-mid);
    font-size: 0.9rem;
  }

  .cart-summary-row .value { font-weight: 600; color: var(--text); }
  .cart-summary-row.discount { color: var(--success); }
  .cart-summary-row.discount .value { color: var(--success); }

  .cart-summary-row.total {
    padding-top: 18px;
    margin-top: 12px;
    border-top: 2px solid var(--border);
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
  }

  .cart-summary-row.total .value {
    background: var(--gradient-warm);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.35rem;
    font-weight: 700;
  }

  /* Coupon */
  .coupon-section {
    padding: 16px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin: 16px 0;
  }

  .coupon-section label {
    display: block;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .coupon-box {
    display: flex;
    gap: 8px;
  }

  .coupon-box input {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg-3);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    outline: none;
    transition: border-color var(--t-fast) var(--ease);
    min-width: 0;
  }

  .coupon-box input:focus { border-color: var(--accent); }

  .coupon-box button {
    padding: 10px 18px;
    background: var(--bg-3);
    color: var(--accent);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all var(--t-fast) var(--ease);
    white-space: nowrap;
  }

  .coupon-box button:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .coupon-msg {
    font-size: 0.82rem;
    margin-top: 8px;
    min-height: 18px;
    line-height: 1.5;
  }

  .coupon-msg.success { color: var(--success); }
  .coupon-msg.error { color: var(--danger); }

  .cart-sidebar .btn {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    font-size: 0.92rem;
  }

  /* Empty Cart */
  .empty-cart {
    text-align: center;
    padding: 80px 20px;
  }

  .empty-cart-icon {
    font-size: 5rem;
    opacity: 0.25;
    margin-bottom: 24px;
    display: block;
  }

  .empty-cart h2 {
    font-size: 1.6rem;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 12px;
  }

  .empty-cart p {
    color: var(--text-dim);
    margin-bottom: 32px;
    font-size: 0.95rem;
  }
</style>

<script src="/js/app.js"></script>
<script src="/js/search.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
