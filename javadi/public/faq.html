<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوالات متداول – JAVADI</title>
<meta name="description" content="پاسخ به سوالات پرتکرار درباره خرید از JAVADI">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<div class="preloader" id="preloader">
  <div class="preloader-logo">JAVADI</div>
  <div class="preloader-bar"></div>
</div>

<div id="headerSlot"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb">
        <a href="/">صفحه اصلی</a>
        <span class="breadcrumb-sep">/</span>
        <span class="current">سوالات متداول</span>
      </div>
      <h1>❓ سوالات متداول</h1>
      <p>پاسخ به سوالات پرتکرار شما</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <!-- Search Box -->
      <div class="faq-search reveal">
        <div class="faq-search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="faqSearch" placeholder="جستجو در سوالات...">
        </div>
      </div>

      <div id="faqContent" style="max-width:860px;margin:0 auto">
        <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
      </div>

      <!-- CTA -->
      <div class="faq-cta reveal">
        <div class="faq-cta-icon">💬</div>
        <h2>سوال دیگری دارید؟</h2>
        <p>تیم پشتیبانی ما آماده پاسخگویی به شماست</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1">
          <a href="/chat" class="btn btn-warm btn-large">
            💬 گفتگوی آنلاین
          </a>
          <a href="/contact" class="btn btn-outline btn-large">
            📩 تماس با ما
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footerSlot"></div>

<style>
  /* ==================== Search ==================== */
  .faq-search {
    max-width: 560px;
    margin: 0 auto 40px;
  }

  .faq-search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 6px 22px;
    transition: all var(--t-fast) var(--ease);
  }

  .faq-search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .faq-search-box .search-icon {
    color: var(--accent);
    font-size: 1.05rem;
  }

  .faq-search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 12px 0;
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }

  .faq-search-box input::placeholder {
    color: var(--text-muted);
  }

  /* ==================== FAQ List ==================== */
  .faq-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .faq-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all var(--t-fast) var(--ease);
  }

  .faq-item.open {
    border-color: var(--accent);
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  .faq-question {
    width: 100%;
    padding: 22px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    text-align: right;
    transition: color var(--t-fast) var(--ease);
    line-height: 1.5;
  }

  .faq-question:hover { color: var(--accent); }

  .faq-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-3);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--t-mid) var(--ease);
    flex-shrink: 0;
    font-size: 1.1rem;
    font-weight: 400;
    border: 1px solid var(--border);
  }

  .faq-item.open .faq-icon {
    background: var(--gradient-gold);
    color: #fff;
    border-color: transparent;
    transform: rotate(45deg);
    box-shadow: 0 4px 12px rgba(201, 150, 62, 0.3);
  }

  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height var(--t-mid) var(--ease);
  }

  .faq-answer-inner {
    padding: 4px 26px 24px;
    color: var(--text-mid);
    line-height: 2;
    font-size: 0.93rem;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    margin-top: 0;
  }

  .faq-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .faq-empty .icon {
    font-size: 3.5rem;
    opacity: 0.3;
    margin-bottom: 16px;
    display: block;
  }

  .faq-empty h3 {
    color: var(--text);
    font-size: 1.15rem;
    margin-bottom: 8px;
    font-weight: 500;
  }

  /* ==================== CTA ==================== */
  .faq-cta {
    margin-top: 60px;
    text-align: center;
    padding: 60px 40px;
    background: linear-gradient(135deg, var(--bg-3), var(--bg-card));
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    position: relative;
    overflow: hidden;
  }

  .faq-cta::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }

  .faq-cta-icon {
    font-size: 2.5rem;
    color: var(--accent);
    margin-bottom: 12px;
    position: relative;
    display: inline-block;
  }

  .faq-cta h2 {
    font-size: clamp(1.4rem, 3vw, 1.85rem);
    font-weight: 300;
    color: var(--text);
    margin-bottom: 10px;
    position: relative;
  }

  .faq-cta p {
    color: var(--text-dim);
    margin-bottom: 28px;
    position: relative;
  }

  @media (max-width: 640px) {
    .faq-question { padding: 18px 20px; font-size: 0.94rem; }
    .faq-answer-inner { padding: 4px 20px 20px; padding-top: 16px; }
    .faq-cta { padding: 40px 24px; margin-top: 40px; }
  }
</style>

<script src="/js/app.js"></script>
<script>
let allFaqs = [];
let filteredFaqs = [];

async function loadFaqs() {
  const wrap = document.getElementById('faqContent');
  try {
    const res = await fetch('/api/faqs');
    allFaqs = await res.json();

    if (!allFaqs.length) {
      wrap.innerHTML = `
        <div class="faq-empty">
          <span class="icon">❓</span>
          <h3>هنوز سوالی ثبت نشده</h3>
          <p>به زودی سوالات متداول اضافه خواهد شد</p>
        </div>
      `;
      return;
    }

    filteredFaqs = allFaqs;
    renderFaqs();
  } catch {
    wrap.innerHTML = '<p class="loading">خطا در بارگذاری.</p>';
  }
}

function renderFaqs() {
  const wrap = document.getElementById('faqContent');

  if (!filteredFaqs.length) {
    wrap.innerHTML = `
      <div class="faq-empty">
        <span class="icon">🔍</span>
        <h3>نتیجه‌ای یافت نشد</h3>
        <p>سوال دیگری را جستجو کنید</p>
      </div>
    `;
    return;
  }

  wrap.innerHTML = `
    <div class="faq-list">
      ${filteredFaqs.map((f, i) => `
        <div class="faq-item reveal" data-faq="${i}">
          <button class="faq-question" onclick="toggleFaq(${i})">
            <span>${esc(f.question)}</span>
            <span class="faq-icon">+</span>
          </button>
          <div class="faq-answer" id="faq-answer-${i}">
            <div class="faq-answer-inner">${esc(f.answer)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  setupReveal();
}

function toggleFaq(index) {
  const item = document.querySelector(`[data-faq="${index}"]`);
  const answer = document.getElementById(`faq-answer-${index}`);
  const isOpen = item.classList.contains('open');

  // بستن بقیه
  document.querySelectorAll('.faq-item.open').forEach(el => {
    el.classList.remove('open');
    const a = el.querySelector('.faq-answer');
    a.style.maxHeight = null;
  });

  // باز کردن این یکی
  if (!isOpen) {
    item.classList.add('open');
    answer.style.maxHeight = answer.scrollHeight + 'px';
  }
}

function setupSearch() {
  const input = document.getElementById('faqSearch');
  if (!input) return;

  input.addEventListener('input', debounce(() => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      filteredFaqs = allFaqs;
    } else {
      filteredFaqs = allFaqs.filter(f =>
        f.question.toLowerCase().includes(q) ||
        f.answer.toLowerCase().includes(q)
      );
    }
    renderFaqs();
  }, 200));
}

async function initFaq() {
  await new Promise(resolve => {
    const check = setInterval(() => {
      if (window.JV.settings && window.JV.settings.site_name) {
        clearInterval(check); resolve();
      }
    }, 50);
  });

  await loadFaqs();
  setupSearch();
}

window.addEventListener('DOMContentLoaded', initFaq);
</script>
</body>
</html>
