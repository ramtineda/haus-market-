<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فراموشی رمز عبور – JAVADI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<div class="preloader" id="preloader">
  <div class="preloader-logo">JAVADI</div>
  <div class="preloader-bar"></div>
</div>

<div id="headerSlot"></div>

<main>
  <section class="auth-section">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-icon">🔐</div>
        <h1 class="auth-title">بازیابی رمز عبور</h1>
        <p class="auth-subtitle" id="authSubtitle">
          ایمیل یا شماره موبایل خود را وارد کنید
        </p>
      </div>

      <!-- ==================== مرحله ۱: وارد کردن ایمیل/موبایل ==================== -->
      <form id="step1Form">
        <div class="form-group">
          <label class="form-label" for="identifier">
            ایمیل یا شماره موبایل <span class="required">*</span>
          </label>
          <input type="text" class="form-input" id="identifier" name="identifier"
                 placeholder="example@email.com یا 09123456789" required autofocus>
          <p style="font-size:0.78rem;color:var(--text-dim);margin-top:6px">
            همان ایمیل یا شماره‌ای که با آن ثبت‌نام کرده‌اید
          </p>
        </div>

        <p class="form-error" id="step1Error"></p>

        <button type="submit" class="btn btn-warm btn-full" id="step1Btn" style="padding:15px">
          🔍 بررسی و ادامه
        </button>

        <div class="auth-divider">
          <span>یا</span>
        </div>

        <a href="/login" class="btn btn-outline btn-full" style="padding:14px">
          بازگشت به ورود
        </a>
      </form>

      <!-- ==================== مرحله ۲: رمز جدید ==================== -->
      <form id="step2Form" style="display:none">
        <div class="user-found-box" id="userFoundBox">
          <div class="user-found-icon">✓</div>
          <div class="user-found-info">
            <div class="user-found-label">حساب کاربری پیدا شد</div>
            <div class="user-found-name" id="userName">—</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">
            رمز عبور جدید <span class="required">*</span>
          </label>
          <div class="password-wrap">
            <input type="password" class="form-input" id="newPassword" name="newPassword"
                   placeholder="حداقل ۶ کاراکتر" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">
            تکرار رمز عبور <span class="required">*</span>
          </label>
          <div class="password-wrap">
            <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                   placeholder="رمز عبور جدید را دوباره وارد کنید" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">👁</button>
          </div>
        </div>

        <p class="form-error" id="step2Error"></p>

        <button type="submit" class="btn btn-warm btn-full" id="step2Btn" style="padding:15px">
          ✓ تغییر رمز عبور
        </button>

        <button type="button" class="btn btn-outline btn-full" style="padding:14px;margin-top:10px"
                onclick="backToStep1()">
          بازگشت
        </button>
      </form>

      <!-- ==================== مرحله ۳: موفقیت ==================== -->
      <div id="successBox" style="display:none;text-align:center;padding:20px 0">
        <div class="success-icon">
          <span>✓</span>
        </div>
        <h2 style="font-size:1.3rem;font-weight:400;color:var(--text);margin:20px 0 8px">
          رمز عبور با موفقیت تغییر کرد!
        </h2>
        <p style="color:var(--text-dim);font-size:0.9rem;margin-bottom:28px">
          حالا می‌توانید با رمز جدید وارد شوید
        </p>
        <a href="/login" class="btn btn-warm btn-full" style="padding:15px">
          🔑 ورود به حساب
        </a>
      </div>
    </div>
  </section>
</main>

<div id="footerSlot"></div>

<style>
  .auth-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 130px 20px 80px;
    background:
      radial-gradient(circle at 20% 20%, var(--accent-glow), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(124, 140, 248, 0.06), transparent 50%),
      var(--bg);
  }

  .auth-box {
    width: 100%;
    max-width: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 48px 40px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }

  .auth-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient-warm);
  }

  @media (max-width: 480px) {
    .auth-box { padding: 32px 22px; }
  }

  .auth-header { text-align: center; margin-bottom: 32px; }

  .auth-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent-glow);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.85rem;
    border: 2px solid rgba(201, 150, 62, 0.2);
    position: relative;
  }

  .auth-icon::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px dashed var(--accent);
    opacity: 0.25;
    animation: rotateSlow 20s linear infinite;
  }

  @keyframes rotateSlow {
    to { transform: rotate(360deg); }
  }

  .auth-title {
    font-size: 1.55rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .auth-subtitle { color: var(--text-dim); font-size: 0.9rem; }

  .password-wrap { position: relative; }
  .password-wrap .form-input { padding-left: 48px; }

  .password-toggle {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 1rem;
    padding: 6px;
    border-radius: 4px;
    transition: color var(--t-fast) var(--ease);
  }

  .password-toggle:hover { color: var(--accent); }

  .auth-divider {
    position: relative;
    text-align: center;
    margin: 24px 0 16px;
    color: var(--text-muted);
    font-size: 0.82rem;
  }

  .auth-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    right: 0;
    left: 0;
    height: 1px;
    background: var(--border);
    z-index: 0;
  }

  .auth-divider span {
    position: relative;
    z-index: 1;
    background: var(--bg-card);
    padding: 0 12px;
  }

  .user-found-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(34, 197, 94, 0.08);
    border: 1.5px solid rgba(34, 197, 94, 0.25);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 24px;
    animation: fadeInUp 0.4s var(--ease);
  }

  .user-found-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
  }

  .user-found-info { flex: 1; }

  .user-found-label {
    color: var(--success);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .user-found-name {
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
  }

  .success-icon {
    width: 90px;
    height: 90px;
    margin: 0 auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.75rem;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
    animation: bounceIn 0.7s var(--ease-bounce);
  }

  @keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3); }
    50% { opacity: 1; transform: scale(1.1); }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script src="/js/app.js"></script>
<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  const type = input.type === 'password' ? 'text' : 'password';
  input.type = type;
  btn.textContent = type === 'password' ? '👁' : '🙈';
}

async function initForgotPassword() {
  await new Promise(resolve => {
    const check = setInterval(() => {
      if (window.JV.settings && window.JV.settings.site_name) {
        clearInterval(check); resolve();
      }
    }, 50);
  });

  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.loggedIn) { window.location.href = '/'; return; }
  } catch {}

  document.getElementById('step1Form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('step1Btn');
    const errEl = document.getElementById('step1Error');
    errEl.textContent = '';

    const identifier = document.getElementById('identifier').value.trim();
    if (!identifier) return;

    btn.disabled = true;
    btn.textContent = 'در حال بررسی...';

    try {
      const res = await fetch('/api/auth/check-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'کاربری با این اطلاعات یافت نشد');

      document.getElementById('userName').textContent = data.user.full_name;
      document.getElementById('authSubtitle').textContent = 'رمز عبور جدید خود را وارد کنید';
      document.getElementById('step1Form').style.display = 'none';
      document.getElementById('step2Form').style.display = 'block';
      document.getElementById('newPassword').focus();

      showToast('✓ حساب کاربری پیدا شد', 'success');
    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = '🔍 بررسی و ادامه';
    }
  });

  document.getElementById('step2Form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('step2Btn');
    const errEl = document.getElementById('step2Error');
    errEl.textContent = '';

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword.length < 6) {
      errEl.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشد';
      return;
    }
    if (newPassword !== confirmPassword) {
      errEl.textContent = 'رمز عبور و تکرار آن یکسان نیستند';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'در حال تغییر...';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          identifier: document.getElementById('identifier').value.trim(),
          newPassword,
        }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'خطا در تغییر رمز');

      document.getElementById('step2Form').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
      document.getElementById('authSubtitle').textContent = 'تمام شد!';
      celebrate();
    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = '✓ تغییر رمز عبور';
    }
  });
}

function backToStep1() {
  document.getElementById('step2Form').style.display = 'none';
  document.getElementById('step1Form').style.display = 'block';
  document.getElementById('authSubtitle').textContent = 'ایمیل یا شماره موبایل خود را وارد کنید';
  document.getElementById('step1Error').textContent = '';
  document.getElementById('identifier').focus();
}

window.addEventListener('DOMContentLoaded', initForgotPassword);
</script>
</body>
</html>
