<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتیجه پرداخت – JAVADI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<div class="preloader" id="preloader">
  <div class="preloader-logo">JAVADI</div>
  <div class="preloader-bar"></div>
</div>

<div id="headerSlot"></div>

<main>
  <section class="section" style="padding-top:140px;padding-bottom:80px;min-height:70vh">
    <div class="container">
      <div class="payment-result" id="resultBox">
        <div class="loading"><div class="spinner"></div>در حال بررسی نتیجه...</div>
      </div>
    </div>
  </section>
</main>

<div id="footerSlot"></div>

<style>
  .payment-result {
    max-width: 580px;
    margin: 0 auto;
    text-align: center;
    padding: 60px 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }

  @media (max-width: 640px) {
    .payment-result { padding: 40px 24px; }
  }

  .payment-result::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
  }

  .payment-result.success::before { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .payment-result.failed::before { background: linear-gradient(135deg, #f87171, #ef4444); }
  .payment-result.cancelled::before { background: linear-gradient(135deg, #fbbf24, #f59e0b); }

  .result-icon-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    background: var(--accent-glow);
    color: var(--accent);
    animation: bounceIn 0.7s var(--ease-bounce);
    position: relative;
  }

  .payment-result.success .result-icon-wrap {
    background: rgba(34, 197, 94, 0.12);
    color: #16a34a;
  }

  .payment-result.failed .result-icon-wrap {
    background: rgba(239, 68, 68, 0.12);
    color: #dc2626;
  }

  .payment-result.cancelled .result-icon-wrap {
    background: rgba(245, 158, 11, 0.12);
    color: #d97706;
  }

  [data-theme="dark"] .payment-result.success .result-icon-wrap { color: #4ade80; }
  [data-theme="dark"] .payment-result.failed .result-icon-wrap { color: #f87171; }
  [data-theme="dark"] .payment-result.cancelled .result-icon-wrap { color: #fbbf24; }

  .result-icon-wrap::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px dashed currentColor;
    opacity: 0.3;
    animation: rotateSlow 15s linear infinite;
  }

  .result-title {
    font-size: clamp(1.35rem, 3vw, 1.75rem);
    font-weight: 400;
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }

  .result-msg {
    color: var(--text-mid);
    font-size: 0.95rem;
    line-height: 1.9;
    margin-bottom: 32px;
  }

  .result-details {
    background: var(--bg-3);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 32px;
    text-align: right;
    border: 1px solid var(--border);
  }

  .result-detail-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 0.9rem;
    color: var(--text-mid);
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px dashed var(--border);
  }

  .result-detail-row:last-child { border-bottom: none; }

  .result-detail-row strong {
    color: var(--accent);
    font-weight: 700;
  }

  .result-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .result-actions .btn {
    padding: 14px 28px;
    font-size: 0.9rem;
  }

  @media (max-width: 480px) {
    .result-actions { flex-direction: column; }
    .result-actions .btn { width: 100%; }
  }
</style>

<script src="/js/app.js"></script>
<script>
function initResult() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const orderId = params.get('orderId');
  const refId = params.get('refId');
  const msg = params.get('msg');

  const box = document.getElementById('resultBox');

  const configs = {
    success: {
      icon: '✓',
      title: 'پرداخت با موفقیت انجام شد',
      msg: 'سفارش شما با موفقیت ثبت و پرداخت شد. از خرید شما سپاسگزاریم!',
      className: 'success',
    },
    cancelled: {
      icon: '!',
      title: 'پرداخت لغو شد',
      msg: 'شما فرآیند پرداخت را لغو کردید. سفارشی ثبت نشد. می‌توانید مجدداً تلاش کنید.',
      className: 'cancelled',
    },
    failed: {
      icon: '✕',
      title: 'پرداخت ناموفق بود',
      msg: 'متأسفانه در پردازش پرداخت خطایی رخ داد. لطفاً مجدداً تلاش کنید یا با پشتیبانی تماس بگیرید.',
      className: 'failed',
    },
    error: {
      icon: '?',
      title: 'خطا در پردازش',
      msg: msg || 'امکان تشخیص نتیجه پرداخت وجود ندارد.',
      className: 'failed',
    },
  };

  const c = configs[status] || configs.error;

  const detailsHtml = (orderId && status === 'success') ? `
    <div class="result-details">
      <div class="result-detail-row">
        <span>شماره سفارش:</span>
        <strong>#${orderId}</strong>
      </div>
      ${refId ? `
        <div class="result-detail-row">
          <span>شماره پیگیری پرداخت:</span>
          <strong>${refId}</strong>
        </div>
      ` : ''}
      <div class="result-detail-row">
        <span>وضعیت:</span>
        <strong style="color:#16a34a">✓ پرداخت شده</strong>
      </div>
    </div>
  ` : '';

  const actionsHtml = {
    success: `
      <a href="/my-orders" class="btn btn-warm">📦 مشاهده سفارش‌های من</a>
      <a href="/products" class="btn btn-outline">ادامه خرید</a>
    `,
    cancelled: `
      <a href="/cart" class="btn btn-warm">بازگشت به سبد خرید</a>
      <a href="/products" class="btn btn-outline">مشاهده محصولات</a>
    `,
    failed: `
      <a href="/cart" class="btn btn-warm">تلاش مجدد</a>
      <a href="/contact" class="btn btn-outline">تماس با پشتیبانی</a>
    `,
    error: `
      <a href="/" class="btn btn-warm">بازگشت به صفحه اصلی</a>
    `,
  };

  box.className = 'payment-result ' + c.className;
  box.innerHTML = `
    <div class="result-icon-wrap">${c.icon}</div>
    <h1 class="result-title">${c.title}</h1>
    <p class="result-msg">${c.msg}</p>
    ${detailsHtml}
    <div class="result-actions">
      ${actionsHtml[status] || actionsHtml.error}
    </div>
  `;

  document.title = c.title + ' – JAVADI';

  // جشن برای پرداخت موفق
  if (status === 'success' && typeof celebrate === 'function') {
    celebrate();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (window.JV && window.JV.settings && window.JV.settings.site_name) {
      clearInterval(check);
      initResult();
    }
  }, 50);
});
</script>
</body>
</html>
